name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Production build
        run: npm run build

      - name: Check bundle size
        run: |
          size=$(du -sk dist/ | cut -f1)
          if [ "$size" -gt 5120 ]; then
            echo "Build size ${size}KB exceeds 5MB limit"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run tests
        run: python -m pytest backend/tests/ -v --tb=short
        continue-on-error: true

      - name: Health check
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8008 &
          sleep 5
          curl -f http://127.0.0.1:8008/health || exit 1
          curl -f http://127.0.0.1:8008/ready || exit 1

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t finintel-api -f backend/Dockerfile .

      - name: Build Web image
        run: docker build -t finintel-web .

      - name: Smoke test
        run: |
          docker run -d --name api-test finintel-api
          docker run -d --name web-test finintel-web
          sleep 5
          docker exec api-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health')"
          docker rm -f api-test web-test

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install npm dependencies
        run: npm ci

      - name: Audit npm
        run: npm audit --production
        continue-on-error: true

      - name: Install pip dependencies
        run: python -m pip install -r backend/requirements.txt safety

      - name: Audit pip
        run: safety check -r backend/requirements.txt
        continue-on-error: true
