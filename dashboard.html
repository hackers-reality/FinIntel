<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinIntel Pro — Enterprise Suite v11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #030303; --card: rgba(255,255,255,0.02); --border: rgba(255,255,255,0.05); --text: #fff; --text-dim: #666; --primary: #00F2FF; }
        [data-theme="light"] { --bg: #fff; --card: #f8f8f8; --border: #ddd; --text: #111; --text-dim: #888; --primary: #007AFF; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); transition: all 0.2s ease; overflow: hidden; }
        .glass { background: var(--card); backdrop-filter: blur(40px); border: 1px solid var(--border); border-radius: 1rem; }
        .tab-active { background: var(--primary); color: #000 !important; font-weight: 800; box-shadow: 0 0 40px rgba(0,242,255,0.2); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#00F2FF', success: '#00FFA3', danger: '#FF0055', warn: '#FFD600' } } } }
    </script>
</head>
<body class="h-screen flex selection:bg-primary/30">

<div id="toast-container" class="fixed top-8 left-1/2 -translate-x-1/2 z-[150] w-full max-w-sm pointer-events-none space-y-3"></div>

<aside class="w-64 border-r border-white/5 flex flex-col p-6 gap-8 bg-black/40 shrink-0">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center shadow-2xl shadow-primary/40"><i data-lucide="shield-check" class="w-6 h-6 text-black"></i></div>
        <span class="text-xl font-black tracking-tighter uppercase italic">FinIntel <span class="text-primary">Pro</span></span>
    </div>
    <nav class="flex-1 space-y-1" id="sidebar-nav"></nav>
    <div class="space-y-4">
        <div class="p-4 glass border-primary/10">
            <div class="flex items-center justify-between text-[9px] font-black uppercase tracking-[0.3em] text-text-dim"><span>Security Mesh</span><span id="ai-status-dot" class="w-1.5 h-1.5 rounded-full bg-danger"></span></div>
            <p id="ai-status-text" class="text-[10px] font-bold text-text-dim mt-1 truncate italic">Stabilizing Node...</p>
        </div>
        <button onclick="toggleTheme()" class="w-full py-3 glass text-[9px] font-black uppercase tracking-widest flex items-center justify-center gap-2 border-white/5 hover:bg-white/5 transition"><i data-lucide="monitor" class="w-3 h-3"></i><span>Interface</span></button>
    </div>
</aside>

<main class="flex-1 flex flex-col overflow-hidden">
    <header class="h-20 border-b border-white/5 flex items-center justify-between px-8 shrink-0">
        <div class="flex items-center gap-10 overflow-x-auto no-scrollbar" id="header-indices"></div>
        <div class="flex items-center gap-4">
            <div id="market-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-success/10 border border-success/20 text-[9px] font-black text-success uppercase tracking-[0.2em]">
                <span class="w-1.5 h-1.5 bg-success rounded-full animate-pulse"></span> Terminal v11 Stable
            </div>
            <button onclick="toggleNotifPanel()" class="p-2.5 glass border-white/5 relative hover:bg-white/5 transition">
                <i data-lucide="bell" class="w-4 h-4 text-text-dim"></i>
                <span id="notif-badge" class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-danger rounded-full hidden"></span>
            </button>
        </div>
    </header>
    <div id="main-content" class="flex-1 overflow-y-auto p-8 custom-scrollbar"></div>
</main>

<div id="notif-panel" class="fixed top-24 right-8 w-80 max-h-[400px] glass z-[140] overflow-y-auto custom-scrollbar hidden border-primary/20 shadow-2xl backdrop-blur-3xl">
    <div class="p-4 border-b border-white/5 flex justify-between items-center"><span class="text-[10px] font-black uppercase tracking-widest">Market Feed</span><button onclick="toggleNotifPanel()"><i data-lucide="x" class="w-3 h-3"></i></button></div>
    <div id="notif-list" class="p-2 space-y-2"></div>
</div>

<div id="research-modal" class="fixed inset-0 z-[160] bg-black/95 backdrop-blur-3xl flex items-center justify-center hidden p-8">
    <div class="glass w-full max-w-6xl max-h-[90vh] flex flex-col p-10 overflow-hidden border-primary/20 shadow-2xl">
        <div class="flex items-center justify-between mb-8 shrink-0 border-b border-white/5 pb-8">
            <div class="flex items-center gap-6">
                <div class="p-4 bg-primary/10 rounded-2xl text-primary border border-primary/20"><i data-lucide="scan-eye" class="w-8 h-8"></i></div>
                <div><h2 class="text-3xl font-black uppercase tracking-tighter" id="research-title">Opportunity Analysis</h2><p class="text-[10px] font-black uppercase tracking-[0.4em] text-text-dim mt-1">Cross-Tier Synthesis Layer</p></div>
            </div>
            <button onclick="closeResearch()" class="p-3 hover:bg-white/10 rounded-full transition"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <div id="research-content" class="flex-1 overflow-y-auto custom-scrollbar"></div>
    </div>
</div>

<script>
const API = (window.location.port === "8008") ? "" : "http://localhost:8008";
let currentTab = "overview";
let settings = {};
let chart = null, mainSeries = null;
let compareQueue = [];
let chartTicker = 'RELIANCE.NS', chartInterval = '1h', chartType = 'area';

const MODELS = {
    nvidia_nim: ["meta/llama-3.1-405b-instruct", "nvidia/llama-3.1-nemotron-70b-instruct"],
    openai: ["gpt-4o", "gpt-4o-mini"],
    anthropic: ["claude-3-5-sonnet-20240620"],
    groq: ["llama-3.1-70b-versatile"]
};

const tabs = [
    { id: 'overview', icon: 'zap', label: 'Terminal' },
    { id: 'analytics', icon: 'trending-up', label: 'Technical' },
    { id: 'compare', icon: 'columns-2', label: 'Side-by-Side' },
    { id: 'history', icon: 'history', label: 'Research Log' },
    { id: 'agent', icon: 'message-square', label: 'AI Strategy' },
    { id: 'settings', icon: 'sliders', label: 'Settings' }
];

async function init() {
    renderNav(); await fetchSettings(); await updateMarketData();
    showTab('overview'); setInterval(updateMarketData, 30000); setInterval(checkNotifs, 15000);
}

async function fetchSettings() {
    try {
        const res = await fetch(API + "/settings"); settings = await res.json();
        document.documentElement.setAttribute('data-theme', settings.theme || 'dark');
        updateAIStatus();
    } catch(e) { console.error(e); }
}

function updateAIStatus() {
    const dot = document.getElementById('ai-status-dot');
    const hasKey = settings.llm_provider && settings.llm_model;
    dot.className = `w-1.5 h-1.5 rounded-full ${hasKey ? 'bg-success shadow-[0_0_8px_#00FFA3]' : 'bg-danger animate-pulse'}`;
    document.getElementById('ai-status-text').textContent = hasKey ? `${settings.llm_provider.toUpperCase()} ACTIVE` : "LINK LLM IN SETTINGS";
}

function renderNav() {
    document.getElementById('sidebar-nav').innerHTML = tabs.map(t => `
        <button onclick="showTab('${t.id}')" id="tab-${t.id}" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all duration-300 hover:bg-white/5 text-text-dim">
            <i data-lucide="${t.icon}" class="w-4 h-4"></i><span>${t.label}</span>
        </button>`).join('');
    lucide.createIcons();
}

function showTab(id) {
    currentTab = id;
    tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t.id}`);
        if (btn) {
            if (t.id === id) btn.classList.add('tab-active');
            else btn.classList.remove('tab-active');
        }
    });
    renderContent();
}

function renderContent() {
    const c = document.getElementById('main-content'); if (!c) return;
    c.innerHTML = '';
    if (currentTab === 'overview') renderOverview(c);
    else if (currentTab === 'analytics') renderAnalytics(c);
    else if (currentTab === 'compare') renderCompare(c);
    else if (currentTab === 'history') renderHistoryTab(c);
    else if (currentTab === 'agent') renderAgent(c);
    else if (currentTab === 'settings') renderSettings(c);
    lucide.createIcons();
}

async function renderOverview(c) {
    const res = await fetch(API + "/market/overview"); const data = await res.json();
    let html = `<div class="fade-in space-y-12 pb-20">
        <div class="flex items-end justify-between border-b border-white/5 pb-8">
            <div><h1 class="text-4xl font-black tracking-tighter uppercase italic">Market Terminal</h1><p class="text-[10px] font-black uppercase tracking-[0.4em] text-text-dim mt-2 italic">Synthesizing Fresh India-Only Intelligence</p></div>
        </div>`;
    
    for (const [category, assets] of Object.entries(data.categories || {})) {
        html += `<section class="space-y-6">
            <div class="flex items-center gap-4"><h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-primary">${category}</h2><div class="flex-1 h-px bg-white/5"></div></div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                ${assets.map(s => `<div class="glass p-6 group cursor-pointer hover:border-primary/40 transition-all duration-500" onclick="openChart('${s.ticker}')">
                    <div class="flex justify-between items-start mb-6">
                        <div><div class="flex items-center gap-2"><h3 class="font-black text-sm group-hover:text-primary transition-colors italic">${s.display_name}</h3>
                            <button onclick="event.stopPropagation();toggleFav('${s.ticker}')"><i data-lucide="star" class="w-3.5 h-3.5 ${s.is_favorite ? 'text-primary fill-primary' : 'text-text-dim'}"></i></button></div>
                            <span class="text-[9px] font-black text-text-dim uppercase tracking-[0.2em]">${category}</span></div>
                        <div class="text-right"><div class="text-sm font-black mono tracking-tighter">${s.price.toLocaleString('en-IN')}</div>
                            <div class="text-[10px] font-black mt-1 ${s.change >= 0 ? 'text-success' : 'text-danger'} tracking-tighter italic">${s.change >= 0 ? '+' : ''}${s.change}%</div></div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="event.stopPropagation();startResearch('${s.ticker}')" class="flex-1 py-2.5 glass text-[9px] font-black uppercase tracking-[0.2em] text-primary hover:bg-primary hover:text-black transition-all border-white/5">Research</button>
                        <button onclick="event.stopPropagation();addToCompare('${s.ticker}')" class="p-2.5 glass border-white/5 hover:text-primary transition-all"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
                    </div>
                </div>`).join('')}
            </div></section>`;
    }
    const newsRes = await fetch(API + "/market/traders/news");
    const newsData = await newsRes.json();
    
    html += `<section class="space-y-6 pt-12">
        <div class="flex items-center gap-4"><h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-primary">Strategic Moats & Whale Tracking</h2><div class="flex-1 h-px bg-white/5"></div></div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${newsData.map(n => `<div class="glass p-6 border-white/5 hover:border-primary/20 transition cursor-pointer" onclick="window.open('${n.url}')">
                <div class="flex items-center gap-3 mb-3"><span class="px-2 py-0.5 bg-primary/10 text-primary text-[8px] font-black uppercase rounded">${n.trader}</span><span class="text-[8px] text-text-dim font-bold">${n.date}</span></div>
                <h4 class="text-xs font-bold leading-relaxed mb-2">${n.title}</h4>
                <p class="text-[10px] text-text-dim line-clamp-2 italic">${n.snippet}</p>
            </div>`).join('') || '<div class="col-span-2 p-10 text-center opacity-30 text-[10px] font-black uppercase tracking-widest">Awaiting Whale Disclosures...</div>'}
        </div></section>`;
    
    c.innerHTML = html + `</div>`;
}

function renderAnalytics(c) {
    c.innerHTML = `<div class="h-full flex flex-col gap-6 fade-in overflow-hidden">
        <div class="flex items-center justify-between px-2">
            <div class="flex items-center gap-6"><h2 class="text-2xl font-black uppercase tracking-tighter italic text-primary" id="chart-ticker-label">${chartTicker}</h2>
                <div class="flex glass p-1 rounded-xl border-white/5 bg-black/40">
                    ${['1m','5m','15m','1h','1d','1wk','1mo'].map(i => `<button onclick="setChartInterval('${i}')" class="px-4 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest ${chartInterval===i?'bg-primary text-black':'text-text-dim hover:text-white'} transition">${i}</button>`).join('')}
                </div>
            </div>
            <div class="flex glass p-1 rounded-xl border-white/5 bg-black/40">
                ${['candle','line','area'].map(t => `<button onclick="setChartType('${t}')" class="px-5 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest ${chartType===t?'bg-primary text-black':'text-text-dim hover:text-white'} transition capitalize">${t}</button>`).join('')}
            </div>
        </div>
        <div class="flex-1 min-h-0 relative"><div id="chart-container" class="absolute inset-0 glass overflow-hidden border-white/5"></div></div>
    </div>`;
    setTimeout(initChart, 200);
}

function initChart() {
    const container = document.getElementById('chart-container'); if (!container) return;
    if (chart) { chart.remove(); chart = null; }
    chart = LightweightCharts.createChart(container, { layout: { background: { color: 'transparent' }, textColor: '#666' }, grid: { vertLines: { color: 'rgba(255,255,255,0.01)' }, horzLines: { color: 'rgba(255,255,255,0.01)' } }, timeScale: { borderColor: 'rgba(255,255,255,0.05)', timeVisible: true } });
    if (chartType === 'candle') mainSeries = chart.addCandlestickSeries({ upColor: '#00FFA3', downColor: '#FF0055', borderUpColor: '#00FFA3', borderDownColor: '#FF0055', wickUpColor: '#00FFA3', wickDownColor: '#FF0055' });
    else if (chartType === 'line') mainSeries = chart.addLineSeries({ color: '#00F2FF', lineWidth: 2 });
    else mainSeries = chart.addAreaSeries({ topColor: 'rgba(0, 242, 255, 0.4)', bottomColor: 'rgba(0, 242, 255, 0)', lineColor: '#00F2FF', lineWidth: 2 });
    window.addEventListener('resize', () => { if (chart) chart.resize(container.offsetWidth, container.offsetHeight); });
    loadChartData();
}

async function loadChartData() {
    try {
        const res = await fetch(API + `/market/chart/${chartTicker}?interval=${chartInterval}`); const data = await res.json();
        if (chartType === 'candle') mainSeries.setData(data);
        else mainSeries.setData(data.map(d => ({ time: d.time, value: d.close })));
        chart.timeScale().fitContent();
    } catch(e) { console.error(e); }
}

function renderCompare(c) {
    c.innerHTML = `<div class="fade-in space-y-12 h-full flex flex-col">
        <div class="flex items-end justify-between border-b border-white/5 pb-8 shrink-0">
            <div><h1 class="text-4xl font-black tracking-tighter uppercase italic">Side-by-Side</h1><p class="text-[10px] font-black uppercase tracking-[0.4em] text-text-dim mt-2 italic">Comparative Intelligence Synthesis</p></div>
            <button onclick="compareQueue=[];renderCompare(document.getElementById('main-content'))" class="text-[9px] font-black uppercase tracking-widest text-danger border border-danger/20 px-5 py-2.5 rounded-xl hover:bg-danger/10 transition">Reset Slots</button>
        </div>
        <div class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-10 min-h-0 pb-10">
            <div id="slot-1" class="h-full">${compareQueue[0] ? '' : `<div class="glass h-full border-dashed border-2 border-white/5 flex flex-col items-center justify-center gap-4 opacity-30"><i data-lucide="plus" class="w-10 h-10"></i><span class="text-[10px] font-black uppercase tracking-widest">Slot 1 Empty</span></div>`}</div>
            <div id="slot-2" class="h-full">${compareQueue[1] ? '' : `<div class="glass h-full border-dashed border-2 border-white/5 flex flex-col items-center justify-center gap-4 opacity-30"><i data-lucide="plus" class="w-10 h-10"></i><span class="text-[10px] font-black uppercase tracking-widest">Slot 2 Empty</span></div>`}</div>
        </div>
        ${compareQueue.length === 2 ? `<div id="compare-synthesis" class="glass p-10 border-primary/20 bg-primary/5 fade-in">
            <div class="flex items-center gap-4 mb-8"><h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-primary">Strategic Moat Synthesis</h2><div class="flex-1 h-px bg-white/5"></div></div>
            <div id="synthesis-content" class="text-sm italic opacity-80 leading-relaxed"><div class="animate-pulse">Synthesizing relative performance moats...</div></div>
        </div>` : ''}
    </div>`;
    if (compareQueue[0]) renderComparePanel(compareQueue[0], 'slot-1');
    if (compareQueue[1]) renderComparePanel(compareQueue[1], 'slot-2');
    if (compareQueue.length === 2) runCompareSynthesis();
    lucide.createIcons();
}

async function runCompareSynthesis() {
    try {
        const res = await fetch(API + `/market/compare?t1=${compareQueue[0]}&t2=${compareQueue[1]}`).then(r => r.json());
        document.getElementById('synthesis-content').innerHTML = res.insight || "Comparison failed. Verify symbols.";
    } catch(e) { document.getElementById('synthesis-content').innerHTML = "Synthesis engine offline."; }
}

async function renderComparePanel(ticker, id) {
    const el = document.getElementById(id);
    el.innerHTML = `<div class="h-full flex items-center justify-center"><div class="w-10 h-10 border-2 border-primary border-t-transparent rounded-full animate-spin"></div></div>`;
    const res = await fetch(API + `/market/research/${ticker}`).then(r => r.json());
    const a = res.analysis;
    el.innerHTML = `<div class="glass p-10 h-full flex flex-col gap-10 border-primary/10 fade-in">
        <div class="flex justify-between items-start">
            <div><h3 class="text-3xl font-black italic uppercase text-primary tracking-tighter">${ticker}</h3><span class="text-[10px] font-black uppercase tracking-[0.3em] text-text-dim">Synthesized Consensus</span></div>
            <div class="p-6 glass bg-primary/5 border-primary/20 text-center"><div class="text-5xl font-black italic mono">${a['Score'] || 85}</div><div class="text-[8px] font-black uppercase tracking-widest text-primary mt-2">Score</div></div>
        </div>
        <div class="space-y-6 flex-1 overflow-y-auto custom-scrollbar pr-4 italic opacity-80 text-xs leading-relaxed">${a['Executive Summary'] || a['Summary']}</div>
        <div class="p-4 glass bg-primary/5 text-[10px] font-bold uppercase tracking-widest text-primary border border-primary/10">Recommendation: ${a['Recommendation'] || 'Hold'}</div>
    </div>`;
}

async function renderHistoryTab(c) {
    c.innerHTML = `<div class="fade-in space-y-12 pb-20">
        <div class="flex items-end justify-between border-b border-white/5 pb-8">
            <div><h1 class="text-4xl font-black tracking-tighter uppercase italic">Research Log</h1><p class="text-[10px] font-black uppercase tracking-[0.4em] text-text-dim mt-2 italic">Persistent Audit of Deep Research Sessions</p></div>
        </div>
        <div id="history-list" class="space-y-4"></div></div>`;
    const res = await fetch(API + "/market/research/history").then(r => r.json());
    document.getElementById('history-list').innerHTML = res.map(h => `
        <div class="glass p-6 flex items-center justify-between border-white/5 hover:border-primary/20 transition cursor-pointer" onclick="startResearch('${h.ticker}')">
            <div class="flex items-center gap-8">
                <div class="text-2xl font-black italic uppercase tracking-tighter text-primary w-24">${h.ticker}</div>
                <div class="text-[10px] font-black uppercase tracking-widest text-text-dim">Score: <span class="text-white">${h.score}</span></div>
                <div class="text-[10px] font-black uppercase tracking-widest text-text-dim">${new Date(h.time).toLocaleString()}</div>
            </div>
            <button class="text-[10px] font-black uppercase tracking-widest text-primary">View Report</button>
        </div>`).join('') || `<div class="p-20 text-center opacity-30 text-[10px] font-black uppercase tracking-widest">No previous research sessions found.</div>`;
}

function renderAgent(c) {
    c.innerHTML = `<div class="h-full flex flex-col glass overflow-hidden fade-in border-white/5 shadow-2xl">
        <div class="p-8 border-b border-white/5 flex justify-between items-center bg-black/20 backdrop-blur-3xl shrink-0"><div class="flex items-center gap-4"><i data-lucide="brain-circuit" class="w-6 h-6 text-primary"></i><h2 class="text-2xl font-black uppercase tracking-tighter italic">Strategic Assistant</h2></div><span class="text-[9px] font-black text-text-dim uppercase tracking-widest border border-white/10 px-3 py-1 rounded-full">Semantic Memory: Active</span></div>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-10 space-y-8 custom-scrollbar"></div>
        <div class="p-8 border-t border-white/5 bg-black/40 backdrop-blur-3xl shrink-0"><div class="flex gap-4 max-w-4xl mx-auto"><input type="text" id="chat-input" placeholder="DEEP QUERY MARKET INTEL..." class="flex-1 bg-black/40 border border-white/10 rounded-2xl px-8 py-5 text-sm font-bold outline-none focus:border-primary transition uppercase tracking-widest shadow-2xl"><button onclick="sendChat()" class="px-10 py-5 bg-primary text-black font-black text-[11px] uppercase tracking-widest rounded-2xl shadow-2xl shadow-primary/30 hover:brightness-110 transition-all">Execute</button></div></div>
    </div>`;
    renderHistory();
}

async function sendChat() {
    const input = document.getElementById('chat-input'), msg = input.value; if (!msg) return;
    input.value = '';
    const messages = document.getElementById('chat-messages');
    messages.innerHTML += `<div class="flex justify-end fade-in"><div class="max-w-[70%] glass p-6 text-sm font-medium leading-relaxed bg-primary/5 border-primary/20 rounded-2xl rounded-tr-none italic">${msg}</div></div>`;
    messages.scrollTop = messages.scrollHeight;
    const res = await fetch(API + "/chat", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }) }).then(r => r.json());
    history = res.history || []; renderHistory();
}

function renderHistory() {
    const messages = document.getElementById('chat-messages'); if (!messages) return;
    messages.innerHTML = history.map(m => `
        <div class="flex ${m.role==='user'?'justify-end':'justify-start'} fade-in">
            <div class="max-w-[80%] glass p-7 text-sm font-medium leading-relaxed ${m.role==='user'?'bg-primary/5 border-primary/20 rounded-2xl rounded-tr-none italic':'border-white/5 rounded-2xl rounded-tl-none'}">
                <div class="flex items-center gap-2 mb-4"><span class="w-1.5 h-1.5 rounded-full ${m.role==='user'?'bg-primary':'bg-text-dim'}"></span><span class="text-[8px] font-black uppercase text-text-dim tracking-widest">${m.role}</span></div>
                <div class="leading-loose opacity-90">${m.content}</div>
            </div>
        </div>`).join('');
    messages.scrollTop = messages.scrollHeight;
    lucide.createIcons();
}

function renderSettings(c) {
    c.innerHTML = `<div class="fade-in max-w-4xl space-y-12 pb-20">
        <div><h1 class="text-4xl font-black uppercase tracking-tighter italic text-primary">System Config</h1><p class="text-[10px] font-black uppercase tracking-[0.4em] text-text-dim mt-2 italic">Infrastructure & API Nodes</p></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <section class="space-y-6">
                <h2 class="text-[11px] font-black uppercase tracking-[0.3em] text-primary">Compute Layer</h2>
                <div class="glass p-8 space-y-8 border-white/5 shadow-2xl">
                    <div class="space-y-4"><label class="text-[10px] font-black text-text-dim uppercase tracking-widest">Provider Node</label><select id="set-provider" onchange="updateModelDropdown()" class="w-full bg-black/40 border border-white/10 rounded-xl px-5 py-4 text-xs font-bold outline-none focus:border-primary transition uppercase tracking-widest">${Object.keys(MODELS).map(p => `<option value="${p}" ${settings.llm_provider===p?'selected':''}>${p}</option>`).join('')}</select></div>
                    <div class="space-y-4"><label class="text-[10px] font-black text-text-dim uppercase tracking-widest">Active Model</label><select id="set-model" class="w-full bg-black/40 border border-white/10 rounded-xl px-5 py-4 text-xs font-bold outline-none focus:border-primary transition uppercase tracking-widest"></select></div>
                    <div class="space-y-4"><label class="text-[10px] font-black text-text-dim uppercase tracking-widest">API Secret</label><input type="password" id="set-key" placeholder="••••••••••••••••" class="w-full bg-black/40 border border-white/10 rounded-xl px-5 py-4 text-xs outline-none focus:border-primary transition"></div>
                    <button onclick="verifyKey()" id="verify-btn" class="w-full py-4 bg-primary text-black font-black text-[10px] uppercase tracking-[0.3em] rounded-xl hover:brightness-110 active:scale-[0.98] transition-all shadow-2xl shadow-primary/20">Verify Node</button>
                </div>
            </section>
            <section class="space-y-6">
                <h2 class="text-[11px] font-black uppercase tracking-[0.3em] text-primary">Preferences</h2>
                <div class="glass p-8 space-y-8 border-white/5 shadow-2xl">
                    <div class="space-y-4"><label class="text-[10px] font-black text-text-dim uppercase tracking-widest">Risk Profile</label><select id="set-risk" class="w-full bg-black/40 border border-white/10 rounded-xl px-5 py-4 text-xs font-bold outline-none focus:border-primary transition uppercase tracking-widest"><option value="growth" ${settings.risk_profile==='growth'?'selected':''}>Aggressive Growth</option><option value="preservation" ${settings.risk_profile==='preservation'?'selected':''}>Capital Preservation</option><option value="risk-adjusted" ${settings.risk_profile==='risk-adjusted'?'selected':''}>Risk Adjusted</option></select></div>
                    <div class="flex justify-between items-center"><span class="text-[10px] font-black text-text-dim uppercase tracking-widest">Notifications</span><button onclick="toggleNotif()" class="w-12 h-6 glass relative rounded-full border-white/10"><span id="notif-switch" class="absolute top-1 left-1 w-4 h-4 rounded-full transition-all bg-text-dim"></span></button></div>
                    <button onclick="savePrefs()" class="w-full py-4 glass text-[10px] font-black uppercase tracking-[0.2em] rounded-xl hover:bg-white/5 active:scale-[0.98] transition-all border-white/10">Sync Engine</button>
                </div>
            </section>
        </div></div>`;
    updateModelDropdown(); updateNotifSwitch();
}

function updateNotifSwitch() { const s = document.getElementById('notif-switch'); if (!s) return; s.style.left = settings.notifications ? '24px' : '4px'; s.className = `absolute top-1 w-4 h-4 rounded-full transition-all ${settings.notifications ? 'bg-primary' : 'bg-text-dim'}`; }
function toggleNotif() { settings.notifications = !settings.notifications; updateNotifSwitch(); }
async function savePrefs() { settings.risk_profile = document.getElementById('set-risk').value; await fetch(API + "/settings", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(settings) }); showToast("Config Synced", "success"); }

function setChartInterval(i) { chartInterval = i; renderAnalytics(document.getElementById('main-content')); }
function setChartType(t) { chartType = t; renderAnalytics(document.getElementById('main-content')); }
function openChart(t) { chartTicker = t; showTab('analytics'); }
function toggleNotifPanel() { document.getElementById('notif-panel').classList.toggle('hidden'); document.getElementById('notif-badge').classList.add('hidden'); }
function closeResearch() { document.getElementById('research-modal').classList.add('hidden'); }
function showToast(msg, type="info") { const container = document.getElementById('toast-container'), toast = document.createElement('div'); const colors = { success: 'border-success text-success bg-success/10', danger: 'border-danger text-danger bg-danger/10', info: 'border-primary text-primary bg-primary/10' }; toast.className = `glass p-4 border-l-4 ${colors[type]} flex items-center justify-between shadow-2xl fade-in mb-3 border-y-0 border-r-0`; toast.innerHTML = `<span class="text-[9px] font-black uppercase tracking-widest">${msg}</span><button onclick="this.parentElement.remove()" class="p-1 opacity-50 hover:opacity-100 transition">X</button>`; container.appendChild(toast); setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000); }
function addToCompare(t) { if (compareQueue.includes(t)) return; if (compareQueue.length >= 2) compareQueue.shift(); compareQueue.push(t); showToast(`Added ${t} to Compare Slots`, "success"); }

async function checkNotifs() {
    try {
        const res = await fetch(API + "/notifications"); const data = await res.json();
        const list = document.getElementById('notif-list'); if (!list) return;
        if (data.length > 0) {
            const last = data[data.length-1];
            if (list.dataset.last !== last.id) {
                document.getElementById('notif-badge').classList.remove('hidden');
                list.dataset.last = last.id;
                showToast(`MARKET ALERT: ${last.symbol} ${last.type.toUpperCase()}`, "info");
            }
        }
        list.innerHTML = data.reverse().map(n => `<div onclick="window.open('${n.source}')" class="p-3 glass border-white/5 hover:border-primary/30 transition cursor-pointer"><div class="flex justify-between text-[8px] font-black uppercase mb-1"><span>${n.symbol}</span><span class="${n.type==='surge'?'text-success':'text-danger'}">${n.type}</span></div><div class="text-[10px] font-bold">${n.price} (${n.change}%)</div></div>`).join('');
    } catch(e) {}
}

async function startResearch(ticker) {
    const modal = document.getElementById('research-modal'), content = document.getElementById('research-content');
    document.getElementById('research-title').textContent = `Synthesizing Intelligence: ${ticker}`;
    content.innerHTML = `<div class="h-64 flex items-center justify-center flex-col gap-6"><div class="w-16 h-16 border-4 border-primary/20 border-t-primary rounded-full animate-spin"></div><p class="text-[11px] font-black uppercase tracking-[0.4em] text-text-dim">Deep Synthesis Layer Consulting...</p></div>`;
    modal.classList.remove('hidden');
    try {
        const res = await fetch(API + `/market/research/${ticker}`).then(r => r.json());
        const a = res.analysis;
        content.innerHTML = `<div class="fade-in grid grid-cols-1 lg:grid-cols-12 gap-10"><div class="lg:col-span-8 space-y-10"><section class="space-y-4"><h3 class="text-xs font-black uppercase tracking-widest text-primary flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4"></i> Analysis Summary</h3><p class="text-sm leading-relaxed text-gray-400 opacity-90">${a['Executive Summary'] || a['Summary']}</p></section><div class="p-8 glass border-l-4 border-primary bg-primary/5 shadow-2xl"><h4 class="text-[10px] font-black uppercase text-primary mb-4 tracking-widest">Deployment Strategy</h4><p class="text-xs leading-relaxed text-gray-400 font-medium">${a['Strategic Recommendation (Short/Long Term)'] || a['Recommendation']}</p></div></div><div class="lg:col-span-4 space-y-8"><div class="glass p-10 text-center border-primary/30 shadow-2xl shadow-primary/10 bg-black/40"><h3 class="text-[11px] font-black uppercase text-primary tracking-[0.3em] mb-4">Conviction Index</h3><div class="text-8xl font-black text-white italic mono tracking-tighter">${a['Score'] || 85}</div><div class="mt-4 flex justify-between px-2 items-center"><span class="text-[9px] font-black text-text-dim uppercase tracking-widest">Risk: ${settings.risk_profile}</span><span class="text-[9px] font-black text-success uppercase tracking-widest">Live Node</span></div></div></div></div>`;
        lucide.createIcons();
    } catch(e) { content.innerHTML = `<div class="p-10 text-center text-danger font-black uppercase text-[10px] tracking-widest italic">Intelligence synthesis failed. Verify API configuration.</div>`; }
}

async function verifyKey() {
    const p = document.getElementById('set-provider').value, m = document.getElementById('set-model').value, k = document.getElementById('set-key').value;
    const btn = document.getElementById('verify-btn'); btn.textContent = "VALIDATING...";
    try {
        const res = await fetch(API + "/auth/verify", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ provider: p, model: m, key: k }) }).then(r => r.json());
        if (res.status === 'success') { showToast(res.message, "success"); settings.llm_provider = p; settings.llm_model = m; await fetch(API + "/settings", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(settings) }); updateAIStatus(); }
        else showToast(res.message, "danger");
    } catch(e) { showToast("Verification Node Error", "danger"); }
    btn.textContent = "Verify Node";
}

function updateModelDropdown() { const p = document.getElementById('set-provider').value; document.getElementById('set-model').innerHTML = MODELS[p].map(m => `<option value="${m}" ${settings.llm_model===m?'selected':''}>${m}</option>`).join(''); }
async function toggleFav(t) { const res = await fetch(API + "/market/favorites/toggle", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticker: t }) }).then(r => r.json()); settings.favorites = res.favorites; renderOverview(document.getElementById('main-content')); }
async function updateMarketData() { try { const res = await fetch(API + "/market/overview"); const data = await res.json(); document.getElementById('header-indices').innerHTML = data.indices.map(i => `<div class="flex flex-col min-w-[130px]"><span class="text-[9px] font-black text-text-dim uppercase tracking-[0.2em] mb-1">${i.name}</span><div class="flex items-center gap-2"><span class="text-sm font-black mono tracking-tighter">${i.price.toLocaleString('en-IN')}</span><span class="text-[9px] font-black ${i.change >= 0 ? 'text-success' : 'text-danger'} tracking-tighter">${i.change >= 0 ? '+' : ''}${i.change}%</span></div></div>`).join(''); } catch(e) {} }
function toggleTheme() { settings.theme = settings.theme === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', settings.theme); fetch(API + "/settings", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(settings) }); }

init();
</script>
</body>
</html>
