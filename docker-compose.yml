version: '3.8'

services:
  finintel-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finintel-api
    ports:
      - "8008:8008"
    volumes:
      - ./backend:/app/backend
      - ./finintel.db:/app/finintel.db
      - ./.env:/app/.env
    env_file:
      - .env
    restart: always

  finintel-web:
    build: .
    container_name: finintel-web
    ports:
      - "5173:5173"
    depends_on:
      - finintel-api
    restart: always
