version: '3.8'

services:
  nexus-kernel:
    build: ./backend
    container_name: nexus-kernel
    ports:
      - "8008:8008"
    volumes:
      - ./backend:/app
      - ./finintel.db:/app/finintel.db
    env_file:
      - .env
    restart: always

  tactical-interface:
    build: .
    container_name: tactical-interface
    ports:
      - "5173:5173"
    depends_on:
      - nexus-kernel
    restart: always
