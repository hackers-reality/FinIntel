services:
  postgres:
    image: postgres:16-alpine
    container_name: finintel-db
    environment:
      POSTGRES_USER: ${DB_USER:-finintel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finintel_secret}
      POSTGRES_DB: ${DB_NAME:-finintel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finintel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    profiles:
      - production

  finintel-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finintel-api
    ports:
      - "8008:8008"
    volumes:
      - ./backend:/app/backend
      - ./finintel.db:/app/finintel.db
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/finintel.db}
      FININTEL_JWT_SECRET: ${FININTEL_JWT_SECRET:-}
      FININTEL_APP_SECRET: ${FININTEL_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  finintel-web:
    build: .
    container_name: finintel-web
    ports:
      - "5173:5173"
    depends_on:
      finintel-api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: finintel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - finintel-api
      - finintel-web
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
