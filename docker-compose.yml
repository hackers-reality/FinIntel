version: '3.8'

services:
  finintel-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finintel-api
    ports:
      - "8008:8008"
    volumes:
      - ./backend:/app/backend
      - ./finintel.db:/app/finintel.db
      - ./.env:/app/.env
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: always

  finintel-web:
    build: .
    container_name: finintel-web
    ports:
      - "5173:5173"
    depends_on:
      finintel-api:
        condition: service_healthy
    restart: always
